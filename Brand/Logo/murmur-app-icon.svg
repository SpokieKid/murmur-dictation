      <stop stop-color="#e1f2ec"/><stop offset="1" stop-color="#a9d5ce"/>
    </linearGradient>
    <linearGradient id="fur" x2=".3" y2="1">
      <stop stop-color="#fffdf5"/><stop offset=".72" stop-color="#f7f0df"/><stop offset="1" stop-color="#e6d9c4"/>
