name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build release with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors
