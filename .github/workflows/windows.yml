name: Windows

on:
  push:
    branches: [arvin]
    paths: ["Windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["Windows/**", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Check speech pipeline without network requests
        run: dotnet run --project Windows/Murmur.Core.Tests -c Release
      - name: Build self-contained Windows application without bundled credentials
        run: >-
          dotnet publish Windows/Murmur.Windows/Murmur.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=false -p:EnableCompressionInSingleFile=true
          -o build/windows/ci-publish
      - name: Check the real Windows setup window starts
        shell: pwsh
        run: |
          $process = Start-Process "$pwd/build/windows/ci-publish/Murmur.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Murmur exited during startup: $($process.ExitCode)" }
              if ($process.MainWindowTitle -like 'Murmur*Windows*') { $ready = $true; break }
            }
            if (-not $ready) { throw "The setup window did not appear; observed title: $($process.MainWindowTitle)" }
            Write-Host 'Windows setup window started successfully. Audio and cross-app input require manual acceptance.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
